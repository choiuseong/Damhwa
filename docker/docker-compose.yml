services:
  postgres:
    image: postgres:17
    container_name: damhwa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: damhwa
      POSTGRES_PASSWORD: damhwa
      POSTGRES_DB: damhwa
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: